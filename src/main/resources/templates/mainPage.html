<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>EBook</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <style>
        html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        }
        body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        }
        .background {
        //background-color: green;
        margin-top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        }
        .mainBackPage {
        padding: 0;
        width: 96%;
        //background-color: red;
        height: 100%;
        min-height: 100vh;
        display: flex;
        box-sizing: border-box;
        }
        .titleAndAuth {
        width: 40vh;
        //background-color: blue;
        border-left: solid;
        border-right: solid;
        display: flex;
        flex-direction: column;
        }
        .appName {
        display: flex;
        align-items: center;
        gap: 10%;
        margin-left: 10%;
        }
        .appName img {
        width: 20%;
        }
        .appName h1{
        font-family: Arial Black;
        font-size: 5vh;
        color: black;
        }
        .authMessage {
        border-top: solid;
        border-bottom: solid;
        //background-color: red;
        color: black;
        min-height: 20vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1.5vw;
        }
        .message {
        font-family: Arial;
        font-size: 150%;
        padding: 2% 2% 0% 4%;
        }
        .buttons {
        padding: 0% 0% 0% 4%;
        font-family: Arial;
        font-size: 150%;
        display: flex;
        justify-content: center;
        gap: 30%;
        }
        .buttons a {
        text-decoration: none;
        color: black;
        }
        .feed {
        width: 70%;
        //background-color: purple;
        border-right: solid;
        }
        .feed h1 {
        font-family: Arial Black;
        font-size: 300%;
        color: black;
        padding: 0% 0% 0% 5%;
        }
        .feed button {
        font-family: Arial Black;
        font-size: 150%;
        color: black;
        }
        .searchButton {
        justify-content: right;
        display: flex;
        gap: 0.2%;
        }
        .postTable {
        width: 100%;
        border-top: solid;
        border-bottom: solid;
        background-color: white;
        }
        .postTable th, td {
        border: 1px solid gray;
        padding: 8px;
        }
        .topTable {
        text-align: center;
        vertical-align: middle;
        font-family: Arial;
        font-size: 150%;
        }
        .language {
        width: 10%;
        //background-color: cyan;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .select {
        margin: 10% 10% 0% 20%;
        }
        .authorizedUser {
        border-top: solid;
        border-bottom: solid;
        //background-color: red;
        color: black;
        min-height: 20vh;
        width: 100%;
        display: flex;
        gap: 1.5vw;
        }
        .image {
        width: 15vh;
        }
        .userName {
        margin: 0%;
        font-family: Arial;
        font-size: 150%;
        }
        .userButtons {
        margin-top: 5%;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        padding-top: 10%;
        }
    </style>
</head>
<body>
<div class="background">
    <div class="mainBackPage">
        <div class="titleAndAuth">
            <div class="appName">
                <img th:src="@{/images/icon.png}" alt="icon.png">       <!--- CHANGE -->
                <h1>EBook</h1>
            </div>
            <div class="authMessage" sec:authorize="!isAuthenticated()">
                <p class="message">Hello, guest, do you want to tell us, who you are?</p>
                <div class="buttons">
                    <b><a th:href="@{/register}">Register</a></b>       <!--- CHANGE -->
                    <b><a th:href="@{/login}">Log In</a></b>       <!--- CHANGE -->
                </div>
            </div>
            <div class="authorizedUser" sec:authorize="isAuthenticated()">
                <div style="margin-top: 3%; margin-left: 3%">
                    <img th:src="@{/images/userImage.png}" src="userImage.png" class="image">
                </div>
                <div style="margin-top: 3%">
                    <p class="userName" sec:authentication="name">name</p>
                    <div class="userButtons" th:object="${#authentication.principal}">
                        <b><a th:href="@{/user/{id}/profile(id=${userId})}">Profile</a></b>
                        <b><a th:href="@{/user/{id}/posts(id=${userId})}">My posts</a></b>
                        <b><a th:href="@{/user/{id}/commentaries(id=${userId})}">Commentaries</a></b>
                        <b><a th:href="@{/faq(param='carma')}"><span>Carma: </span><span th:text="${carma}">number</span></a></b>
                        <b><a th:href="@{/logout}">Log Out</a></b>       <!--- CHANGE -->
                    </div>
                </div>
            </div>
        </div>
        <div class="feed">
            <h1>Feed</h1>
            <div class="searchButton"><!--- CHANGE -->
                <form sec:authorize="isAuthenticated()" th:action="@{/create}" method="get">
                    <button>Create Post</button>
                </form>
                <form th:action="@{/search}" method="get">
                    <button>Search</button>
                </form>
            </div>
            <table class="postTable">                         <!--- CHANGE -->
                <thead>
                    <tr class="topTable">
                        <td style="width: 60%">Title</td>
                        <td style="width: 20%">Author</td>
                        <td style="width: 20%">Date</td>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${posts}">
                        <td>
                            <a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.postName}"></a>
                        </td>
                        <td th:text="${post.user.username}"></td>
                        <td th:text="${post.date}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="language">
            <div class="select">
                <a href="nigger.html"><img th:src="@{images/eng.png}" alt="eng.png"></a>
                <a href="nigger.html"><img th:src="@{images/rus.png}" alt="rus.png"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
