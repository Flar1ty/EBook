<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>EBook</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <style>
        html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        }
        body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        }
        .background {
        //background-color: green;
        margin-top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        }
        .mainBackPage {
        padding: 0;
        width: 96%;
        //background-color: red;
        height: 100%;
        min-height: 100vh;
        display: flex;
        box-sizing: border-box;
        }
        .titleAndAuth {
        //background-color: blue;
        font-family: Arial;
        //font-size: 120%;
        display: flex;
        flex-direction: column;
        gap: 1vh;
        width: 100%;
        }
        .feed {
        width: 70%;
        //background-color: purple;
        border-right: solid;
        display: flex;
        //justify-content: center;
        }
        .feed h1 {
        font-family: Arial Black;
        font-size: 300%;
        color: black;
        padding: 0% 0% 0% 5%;
        width: 100%;
        }
        .language {
        width: 10%;
        //background-color: cyan;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .select {
        margin: 10% 10% 0% 20%;
        }
        .appName a {
        display: flex;
        align-items: center;
        gap: 10%;
        margin-left: 10%;
        text-decoration: none;
        }
        .appName img {
        width: 20%;
        }
        .appName h1{
        font-family: Arial Black;
        font-size: 5vh;
        color: black;
        }
        .title {
        width: 20%;
        //background-color: blue;
        border-left: solid;
        border-right: solid;
        gap: 10%;
        }
        .language {
        width: 10%;
        //background-color: cyan;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .postPart {
        //padding-left: 5%;

        }
        .upperPart {
        padding-left: 5%;
        border-bottom: solid gray 2px;
        }
        .lowerPart {
        padding-left: 5%;
        }
        .postName {
        font-family: Arial;
        font-size: 200%;
        margin: 0%;
        margin-bottom: 1%;
        }
        .tagsLine {
        display: flex;
        }
        .tagsLine p {
        margin: 0%;
        margin-bottom: 1%;
        }
        .postText {
        white-space: pre-wrap;
        margin: 0%;
        margin-top: 2%;
        font-size: 150%;
        }
        .commentaries {
        padding-left: 5%;
        padding-right: 5%;
        }
        .commentaryInput textarea {
        width: 100%;
        height: 8vh;
        resize: none;
        }
        .authorizedUser {
        border-top: solid;
        border-bottom: solid;
        //background-color: red;
        color: black;
        min-height: 20vh;
        width: 100%;
        display: flex;
        gap: 1.5vw;
        }
        .image {
        width: 15vh;
        }
        .userName {
        margin: 0%;
        font-family: Arial;
        font-size: 150%;
        }
        .userButtons {
        margin-top: 5%;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        padding-top: 10%;
        }
        .ratingDiv {
            display: flex;
            align-items: center;
            justify-content: end;
            font-family: Arial;
            font-size: 2.5vh;
        }
    </style>
</head>
<body>
<div class="background">
    <div class="mainBackPage">
        <div class="title">
            <div class="appName">
                <a th:href="@{/}">
                    <img th:src="@{/images/icon.png}" alt="icon.png">
                    <h1>EBook</h1>
                </a>
            </div>
            <div class="authorizedUser" sec:authorize="isAuthenticated()">
                <div style="margin-top: 3%; margin-left: 3%">
                    <img th:src="@{/images/userImage.png}" src="userImage.png" class="image">
                </div>
                <div style="margin-top: 3%">
                    <p class="userName" sec:authentication="name">name</p>
                    <div class="userButtons" th:object="${#authentication.principal}">
                        <b><a th:href="@{/user/{id}/profile(id=${userId})}">Profile</a></b>
                        <b><a th:href="@{/user/{id}/posts(id=${userId})}">My posts</a></b>
                        <b><a th:href="@{/user/{id}/commentaries(id=${userId})}">Commentaries</a></b>
                        <b><a th:href="@{/faq(param='carma')}"><span>Carma: </span><span th:text="${carma}">number</span></a></b>
                        <b><a th:href="@{/logout}">Log Out</a></b>       <!--- CHANGE -->
                    </div>
                </div>
            </div>
        </div>
        <div class="feed">
            <div class="titleAndAuth">
                <div>
                    <h1>Post</h1>
                </div>
                <div class="postPart">
                    <form th:object="${post}" class="creationDiv" style="width:100%">
                        <div class="upperPart">
                            <b><p th:text="*{postName}" class="postName">Post name</p></b>
                            <div class="tagsLine">
                                <p>Tags: </p>
                                <div style="display: flex; gap: 0.5vh; flex-direction:inherit;">
                                    <div th:each="tag : *{postTags}">
                                        <p th:text="${tag.name}" th:style="${tag.black} ? |border: solid 1px; font-weight: bold;| : |border: solid 1px;|">tag Placeholder</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="lowerPart" style="border-bottom: solid gray 2px;">
                            <p th:text="*{postText}" class="postText">Post default text</p>
                        </div>
                    </form>
                    <div class="ratingDiv">
                        <form th:action="@{/post/{id}/vote(id=${post.id})}" sec:authorize="isAuthenticated()" method="post" th:object="${voteRequest}">
                            <input value="true" type="hidden" name="upVote">
                            <img src="arrow-up-blank.png" id="upVote">
                            <button>+</button>
                        </form>
                        <b><span id="rating" th:text="${rating}">0</span></b>
                        <form th:action="@{/post/{id}/vote(id=${post.id})}" sec:authorize="isAuthenticated()" method="post" th:object="${voteRequest}">
                            <input value="false" type="hidden" name="upVote">
                            <button>-</button>
                            <img src="arrow-down-blank.png" id="downVote">
                        </form>
                    </div>
                    <div class="commentaries">
                        <div sec:authorize="!isAuthenticated()">
                            <p>Want to leave a comment?
                                <a th:href="@{/register}"><span>Register</span></a>
                                or
                                <a th:href="@{/login}"><span>Log in</span></a>
                                then!
                            </p>
                        </div>
                        <form method="POST" th:action="@{/post/{uuid}(uuid=${post.id})}" th:object="${commentaryRequest}" sec:authorize="isAuthenticated()">
                            <div class="commentaryInput">
                                <input type="hidden" th:value="${post.id}" name="postId">
                                <textarea th:field="*{commentaryText}"></textarea>
                            </div>
                            <button>Leave a comment</button>
                        </form>
                        <div th:each="commentary : ${post.commentaries}" style="display: flex; gap: 2vh;">
                            <img th:src="@{/images/userImage.png}" src="userImage.png" class="image" style="width: 15vh;">
                            <p th:text="${commentary.commentaryText}">Commentary placeholder</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="language">
            <div class="select">
                <a href="nigger.html"><img th:src="@{/images/eng.png}" alt="eng.png"></a>
                <a href="nigger.html"><img th:src="@{/images/rus.png}" alt="rus.png"></a>
            </div>
        </div>
    </div>
</div>
<script>
    var upVote = document.getElementById('upVote');
    var downVote = document.getElementById('downVote');
    const rate = document.getElementById('rating');
    upVote.addEventListener('click', function() {
        if(upVote.src.match("arrow-up-blank.png")){
            upVote.src = "arrow-up-green.png";
            rate.textContent = parseInt(rate.textContent, 10) + 1;
            if(downVote.src.match("arrow-down-red.png")) {
                downVote.src = "arrow-down-blank.png";
                rate.textContent = parseInt(rate.textContent, 10) + 1;
            }
        }
        else {
            upVote.src = "arrow-up-blank.png";
            rate.textContent = parseInt(rate.textContent, 10) - 1;
        }
    });
    downVote.addEventListener('click', function() {
        if(downVote.src.match("arrow-down-blank.png")){
            downVote.src = "arrow-down-red.png";
            rate.textContent = parseInt(rate.textContent, 10) - 1;
            if(upVote.src.match("arrow-up-green.png")){
                upVote.src = "arrow-up-blank.png";
                rate.textContent = parseInt(rate.textContent, 10) - 1;
            }
        }
        else {
            downVote.src = "arrow-down-blank.png";
            rate.textContent = parseInt(rate.textContent, 10) + 1;
        }
    });
</script>
</body>
</html>
