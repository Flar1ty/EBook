<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>EBook</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <style>
        html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        }
        body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        }
        .background {
        //background-color: green;
        margin-top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        }
        .mainBackPage {
        padding: 0;
        width: 96%;
        //background-color: red;
        height: 100%;
        min-height: 100vh;
        display: flex;
        box-sizing: border-box;
        }
        .titleAndAuth {
        font-family: Arial;
        display: flex;
        flex-direction: column;
        gap: 1vh;
        width: 100%;
        }
        .feed {
        width: 70%;
        //background-color: purple;
        border-right: solid;
        display: flex;
        //justify-content: center;
        }
        .feed h1 {
        font-family: Arial Black;
        font-size: 300%;
        color: black;
        padding: 0% 0% 0% 5%;
        width: 100%;
        }
        .language {
        width: 10%;
        //background-color: cyan;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .select {
        margin: 10% 10% 0% 20%;
        }
        .appName a {
        display: flex;
        align-items: center;
        gap: 10%;
        margin-left: 10%;
        text-decoration: none;
        }
        .appName img {
        width: 20%;
        }
        .appName h1{
        font-family: Arial Black;
        font-size: 5vh;
        color: black;
        }
        .title {
        width: 20%;
        //background-color: blue;
        border-left: solid;
        border-right: solid;
        gap: 10%;
        }
        .language {
        width: 10%;
        //background-color: cyan;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .authorizedUser {
        border-top: solid;
        border-bottom: solid;
        //background-color: red;
        color: black;
        min-height: 20vh;
        width: 100%;
        display: flex;
        gap: 1.5vw;
        }
        .image {
        width: 15vh;
        }
        .userName {
        margin: 0%;
        font-family: Arial;
        font-size: 150%;
        }
        .userButtons {
        margin-top: 5%;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        padding-top: 10%;
        }
        .profileBody {
            display: flex;
            padding-left: 5%;
        }
        .userImage {
            width: 250px;
            height: 250px;
            background-image: url('/images/userImage.png');
            background-position: center;
            background-size: cover;
            align-items: end;
            display: flex;
            justify-content: end;
        }
    </style>
</head>
<body>
<div class="background">
    <div class="mainBackPage">
        <div class="title">
            <div class="appName">
                <a th:href="@{/}">
                    <img th:src="@{/images/icon.png}" alt="icon.png">
                    <h1>EBook</h1>
                </a>
            </div>
            <div class="authorizedUser" sec:authorize="isAuthenticated()">
                <div style="margin-top: 3%; margin-left: 3%">
                    <img th:src="@{/images/userImage.png}" src="userImage.png" class="image">
                </div>
                <div style="margin-top: 3%">
                    <p class="userName" sec:authentication="name">name</p>
                    <div class="userButtons" th:object="${#authentication.principal}">
                        <b><a th:href="@{/user/{id}/profile(id=${userId})}">Profile</a></b>
                        <b><a th:href="@{/user/{id}/posts(id=${userId})}">My posts</a></b>
                        <b><a th:href="@{/user/{id}/commentaries(id=${userId})}">Commentaries</a></b>
                        <b><a th:href="@{/faq(param='carma')}">Carma: 0</a></b>
                        <b><a th:href="@{/logout}">Log Out</a></b>       <!--- CHANGE -->
                    </div>
                </div>
            </div>
        </div>
        <div class="feed">
            <div class="titleAndAuth">
                <div>
                    <h1><span sec:authentication="name">User</span><span>'s profile</span></h1>
                </div>
                <div class="profileBody">
                    <div class="userImage">
                        <img src="edit.png" th:src="@{/images/edit.png}">
                    </div>
                    <div>
                        <p th:text="${username}">Username</p>
                        <p>Registered scince: </p>
                        <p th:text="${description}">Description</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="language">
            <div class="select">
                <a href="nigger.html"><img th:src="@{/images/eng.png}" alt="eng.png"></a>
                <a href="nigger.html"><img th:src="@{/images/rus.png}" alt="rus.png"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
