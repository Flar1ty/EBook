<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EBook</title>
    <style>
        html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        }
        body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        }
        .background {
        background-color: green;
        margin-top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        }
        .mainBackPage {
        padding: 0;
        width: 96%;
        background-color: red;
        height: 100%;
        min-height: 100vh;
        display: flex;
        //justify-content: center;
        box-sizing: border-box;
        }
        .titleAndAuth {
        width: 80%;
        background-color: blue;
        gap: 10%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        font-family: Arial;
        }
        .topTitle {
        font-size: 150%;
        }
        .fields {
        display: flex;
        flex-direction: column;
        gap: 30%;
        }
        .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: Arial;
        font-size: 150%;
        gap: 5%;
        }
        .textField {
        text-align: right;
        flex: 1;
        }
        .field input {
        font-family: Arial;
        font-size: 100%;
        width: 100%;
        }
        .registerButton {
        font-family: Arial Black;
        font-size: 140%;
        margin-top: 10%;
        }
        .title {
        width: 40%;
        }
        .appName a {
        display: flex;
        align-items: center;
        gap: 1%;
        margin-left: 10%;
        text-decoration: none;
        }
        .appName img {
        width: 10%;
        }
        .appName h1{
        font-family: Arial Black;
        font-size: 300%;
        color: white;
        }
    </style>
</head>
<body>
<div class="background">
    <div class="mainBackPage">
        <div class="title">
            <div class="appName">
                <a th:href="@{/}">
                    <img th:src="@{/images/icon.png}" alt="icon.png">
                    <h1>EBook</h1>
                </a>
            </div>
        </div>
        <form method="POST" th:object="${registerRequest}">
        <div class="titleAndAuth">
            <div class="topTitle">
            <h1>Register</h1>
            <h2>Tell us about yourself!</h2>
            </div>
            <div class="fields">
                <div class="field">
                    <p class="textField">Name: </p>
                    <input type="text" th:field="*{username}">
                </div>
                <div class="field">
                    <p class="textField">Password: </p>
                    <input type="password" th:field="*{password}">
                </div>
                <div class="field">
                    <p class="textField">Repeat password: </p>
                    <input type="password" th:field="*{repeatPassword}">
                </div>
            </div>
            <button class="registerButton">Register</button>
        </div>
        </form>
    </div>
</div>
</body>
</html>
