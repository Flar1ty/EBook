<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EBook</title>
    <link rel="icon" th:href="@{/images/favicon.png}" type="image/x-icon">
    <style>
        html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        }
        body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        }
        .background {
        margin-top: 0%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        }
        .mainBackPage {
        padding: 0;
        width: 96%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        box-sizing: border-box;
        }
        .titleAndAuth {
        font-family: Arial;
        display: flex;
        flex-direction: column;
        gap: 1vh;
        }
        .feed {
        width: 70%;
        border-right: solid;
        display: flex;
        }
        .feed h1 {
        font-family: Arial Black;
        font-size: 300%;
        color: black;
        padding: 0% 0% 0% 5%;
        width: 100%;
        }
        .language {
        width: 10%;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .select {
        margin: 10% 10% 0% 20%;
        }
        .appName a {
        display: flex;
        align-items: center;
        gap: 10%;
        margin-left: 10%;
        text-decoration: none;
        }
        .appName img {
        width: 20%;
        }
        .appName h1{
        font-family: Arial Black;
        font-size: 5vh;
        color: black;
        }
        .title {
        width: 20%;
        border-left: solid;
        border-right: solid;
        gap: 10%;
        }
        .language {
        width: 10%;
        }
        .language img {
        display: inline;
        width: 40%;
        border: solid;
        }
        .language a {
        display: inline;
        gap: 90%;
        }
        .postCreation {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        }
        .fields {
        display: flex;
        justify-content: center;
        flex-direction: column;
        width: 80%;
        }
        .fields button {
        width: 20%;
        font-family: Arial;
        font-size: 2vh;
        }
        .field {
        display: flex;
        justify-content: space-between;
        font-family: Arial;
        font-size: 150%;
        width: 100%;
        flex-direction: column;
        }
        .field p {
        margin: 3% 0% 0% 0%;
        }
        .creationDiv {
        width: 100%;
        height: 100%;
        }
        /*.inputField{

        }*/
        .field input {
        width: 100%;
        font-size: 100%;

        border: solid 2px;
        transition: 0.2s;
        }

        .field input:hover {
        border: solid 2px #3b82f6;
        transition: 0.2s;
        }
        .field textarea {
        width: 100%;
        max-width: 100%;
        min-width: 20%;
        height: 100%;
        max-height: 40vh;
        font-family: Arial;
        font-size: 80%;

        border: solid 2px;
        transition: 0.2s;
        }
        .field textarea:hover {
        border: solid 2px #3b82f6;
        transition: 0.2s;
        }
        .field textarea:active {
        transition: none !important;
        }
        .tags {
            overflow-x: hidden;
            overflow-y: auto;
            display: inline-block;
            max-height: 10vh;
        }
        .authorizedUser {
        border-top: solid;
        border-bottom: solid;
        //background-color: red;
        color: black;
        min-height: 20vh;
        width: 100%;
        display: flex;
        gap: 1.5vw;
        }
        .image {
        width: 15vh;
        }
        .userName {
        margin: 0%;
        font-family: Arial;
        font-size: 150%;
        }
        .userButtons {
        margin-top: 5%;
        font-family: Arial;
        display: flex;
        flex-direction: column;
        padding-top: 10%;
        }
    </style>
</head>
<body>
<div class="background">
    <div class="mainBackPage">
        <div class="title">
            <div class="appName">
                <a th:href="@{/}">
                    <img th:src="@{/images/icon.png}" alt="icon.png">
                    <h1>EBook</h1>
                </a>
            </div>
            <div class="authorizedUser" sec:authorize="isAuthenticated()">
                <div style="margin-top: 3%; margin-left: 3%">
                    <img th:src="@{/images/userImage.png}" src="userImage.png" class="image">
                </div>
                <div style="margin-top: 3%">
                    <p class="userName" sec:authentication="name">name</p>
                    <div class="userButtons" th:object="${#authentication.principal}">
                        <b><a th:href="@{/user/{id}/profile(id=${userId})}">Profile</a></b>
                        <b><a th:href="@{/user/{id}/posts(id=${userId})}">My posts</a></b>
                        <b><a th:href="@{/user/{id}/commentaries(id=${userId})}">Commentaries</a></b>
                        <b><a th:href="@{/faq(param='carma')}"><span>Carma: </span><span th:text="${carma}">number</span></a></b>
                        <b><a th:href="@{/logout}">Log Out</a></b>       <!--- CHANGE -->
                    </div>
                </div>
            </div>
        </div>
        <div class="feed">
            <form th:action="@{/create}" method="POST" th:object="${createPostRequest}" class="creationDiv">
                <div class="titleAndAuth">
                    <div>
                        <h1>Post Creation</h1>
                    </div>
                    <div class="postCreation">
                        <div class="fields">
                            <div class="field">
                                <p>Post Name: </p>
                                <input th:field="*{postName}" class="inputField">
                            </div>
                            <div class="field">
                                <p>Post Text: </p>
                                <textarea th:field="*{postText}" class="inputField" type="area"></textarea>
                            </div>
                            <div class="field">
                                <p>Tags: </p>
                                <div style="display: flex; width: 60%; gap: 5%;">
                                    <input class="inputField" id="tagName">
                                    <div style="display: flex; gap: 10%;">
                                        <p>Black</p>
                                        <input type="checkbox" id="isBlack">
                                    </div>
                                    <button style="min-width: 10vh; width: 20%;" type="button" id="addTagButton">Add tag</button>
                                </div>
                            </div>
                            <div class="tags" id="tagsPane">
                                <input type="hidden" id="tagsInput">
                            </div>
                            <button style="margin-top: 2%;">Next</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="language">
            <div class="select">
                <a href="nigger.html"><img th:src="@{images/eng.png}" alt="eng.png"></a>
                <a href="nigger.html"><img th:src="@{images/rus.png}" alt="rus.png"></a>
            </div>
        </div>
    </div>
</div>
<template id="tagTemplate">
    <div style="display: flex;">
        <p style="margin: 0%; " id="textPlaceholder">Text placeholder</p>
        <input type="hidden" id="tag" name="postTags">
        <a id="removeButton"><p style="margin: 0%">X</p></a>
    </div>
</template>
<script>
    const field = document.getElementById('tagName');
    const addButton = document.getElementById('addTagButton');
    const tagsField = document.getElementById('tagsPane');
    const createDiv = document.getElementById('tagTemplate');
    const isBlackField = document.getElementById('isBlack');
    addButton.addEventListener('click', function() {
        const clonnedDiv = createDiv.content.cloneNode(true);
        clonnedDiv.querySelector('#textPlaceholder').textContent = field.value;
        clonnedDiv.querySelector('#tag').value = field.value + ":" + isBlackField.checked;
        clonnedDiv.querySelector('#removeButton').addEventListener('click', function(){
            //alert('remove');
            event.target.closest('div').remove();
        })
        if(isBlackField.checked){
            clonnedDiv.querySelector('#textPlaceholder').style.fontWeight = 'bold';
        }
        tagsField.append(clonnedDiv);
        //alert(field.value);
        field.value = '';
    });
</script>
</body>
</html>
